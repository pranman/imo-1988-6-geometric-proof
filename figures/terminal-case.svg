<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">At the terminal case k is the area of an integer square</title>
<desc id="desc">For a=2, b=8, k=4, four 2-by-8 rectangles exactly fill an 8-by-8 square. No strip remains, so c=0 and bc=a squared minus k gives k=a squared. The accompanying 2-by-2 square is shown at the same scale, divided into four unit squares, so the terminal quotient is 4=2 squared.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker></defs>
<rect x="0" y="0" width="1100" height="560" rx="16" fill="#faf9f6" stroke="none" stroke-width="1"/>
<text x="42" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#173c42" font-weight="bold" text-anchor="start">At the boundary, the leftover width vanishes</text>
<text x="42" y="80" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#567075" font-weight="normal" text-anchor="start">Terminal jump: (a, b) = (2, 8) becomes (0, 2).  Here ka = b, so c = 0.</text>
<rect x="86" y="164" width="288" height="288" rx="0" fill="#e6f1f0" stroke="none" stroke-width="1"/>
<line x1="158" y1="164" x2="158" y2="452" stroke="#167d8d" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="230" y1="164" x2="230" y2="452" stroke="#167d8d" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="302" y1="164" x2="302" y2="452" stroke="#167d8d" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="86" y="164" width="288" height="288" rx="0" fill="none" stroke="#167d8d" stroke-width="2"/>
<rect x="86" y="164" width="288" height="288" rx="0" fill="none" stroke="#173c42" stroke-width="2.5"/>
<line x1="86" y1="139" x2="374" y2="139" stroke="#173c42" stroke-width="1.25"/>
<line x1="86" y1="134" x2="86" y2="144" stroke="#173c42" stroke-width="1.25"/>
<line x1="374" y1="134" x2="374" y2="144" stroke="#173c42" stroke-width="1.25"/>
<text x="230" y="129" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c42" font-weight="normal" text-anchor="middle">ka = b = 8</text>
<text x="122" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#167d8d" font-weight="normal" text-anchor="middle">2 × 8</text>
<text x="194" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#167d8d" font-weight="normal" text-anchor="middle">2 × 8</text>
<text x="266" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#167d8d" font-weight="normal" text-anchor="middle">2 × 8</text>
<text x="338" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#167d8d" font-weight="normal" text-anchor="middle">2 × 8</text>
<line x1="86" y1="479" x2="374" y2="479" stroke="#173c42" stroke-width="1.25"/>
<line x1="86" y1="474" x2="86" y2="484" stroke="#173c42" stroke-width="1.25"/>
<line x1="374" y1="474" x2="374" y2="484" stroke="#173c42" stroke-width="1.25"/>
<text x="230" y="505" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c42" font-weight="normal" text-anchor="middle">four rectangles fill one square</text>
<line x1="429" y1="132" x2="429" y2="479" stroke="#d6dfdc" stroke-width="1"/>
<text x="486" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#167d8d" font-weight="bold" text-anchor="start">NO REMAINDER</text>
<text x="486" y="201" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#173c42" font-weight="bold" text-anchor="start">bc = a² − k = 0</text>
<text x="486" y="249" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#167d8d" font-weight="bold" text-anchor="start">Therefore k = a².</text>
<text x="486" y="300" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#567075" font-weight="normal" text-anchor="start">The quotient is an integer square.</text>
<rect x="486" y="350" width="36" height="36" rx="0" fill="#f4dfb9" stroke="#faf9f6" stroke-width="2"/>
<rect x="522" y="350" width="36" height="36" rx="0" fill="#f4dfb9" stroke="#faf9f6" stroke-width="2"/>
<rect x="486" y="386" width="36" height="36" rx="0" fill="#f4dfb9" stroke="#faf9f6" stroke-width="2"/>
<rect x="522" y="386" width="36" height="36" rx="0" fill="#f4dfb9" stroke="#faf9f6" stroke-width="2"/>
<rect x="486" y="350" width="72" height="72" rx="0" fill="none" stroke="#d69b36" stroke-width="2"/>
<line x1="486" y1="444" x2="558" y2="444" stroke="#173c42" stroke-width="1.25"/>
<line x1="486" y1="439" x2="486" y2="449" stroke="#173c42" stroke-width="1.25"/>
<line x1="558" y1="439" x2="558" y2="449" stroke="#173c42" stroke-width="1.25"/>
<text x="522" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c42" font-weight="normal" text-anchor="middle">a = 2</text>
<text x="595" y="377" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#173c42" font-weight="bold" text-anchor="start">4 unit squares</text>
<text x="595" y="413" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#167d8d" font-weight="bold" text-anchor="start">k = 4 = 2²</text>
<text x="42" y="535" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#567075" font-weight="normal" text-anchor="start">Both squares use the same length scale.  The terminal pair (0, 2) is an auxiliary boundary case.</text>
</svg>
