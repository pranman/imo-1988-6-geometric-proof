<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">The rectangle construction: c equals ka minus b</title>
<desc id="desc">A correctly scaled example with a=8, b=30, k=4. Four adjacent 8-by-30 rectangles make a 32-by-30 strip. Removing its 30-by-30 square leaves a 2-by-30 rectangle of area 60. This equals 8 squared minus 4. The 8-by-8 square at right is at the same scale and illustrates area accounting, not a claimed dissection of that square.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker></defs>
<rect x="0" y="0" width="1100" height="580" rx="16" fill="#faf9f6" stroke="none" stroke-width="1"/>
<text x="42" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#173c42" font-weight="bold" text-anchor="start">A new side appears in the leftover strip</text>
<text x="42" y="80" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#567075" font-weight="normal" text-anchor="start">Example: a = 8, b = 30, k = 4.  Dashed lines mark the original rectangles.</text>
<rect x="88" y="160" width="320" height="300" rx="0" fill="#e6f1f0" stroke="none" stroke-width="1"/>
<rect x="388" y="160" width="20" height="300" rx="0" fill="#f4dfb9" stroke="none" stroke-width="1"/>
<line x1="168" y1="160" x2="168" y2="460" stroke="#167d8d" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="248" y1="160" x2="248" y2="460" stroke="#167d8d" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="328" y1="160" x2="328" y2="460" stroke="#167d8d" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="88" y="160" width="320" height="300" rx="0" fill="none" stroke="#167d8d" stroke-width="2"/>
<rect x="88" y="160" width="300" height="300" rx="0" fill="none" stroke="#173c42" stroke-width="2.5"/>
<line x1="88" y1="133" x2="408" y2="133" stroke="#173c42" stroke-width="1.25"/>
<line x1="88" y1="128" x2="88" y2="138" stroke="#173c42" stroke-width="1.25"/>
<line x1="408" y1="128" x2="408" y2="138" stroke="#173c42" stroke-width="1.25"/>
<text x="248" y="123" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c42" font-weight="normal" text-anchor="middle">ka = 32</text>
<text x="238" y="306" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#173c42" font-weight="bold" text-anchor="middle">b²</text>
<text x="238" y="336" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#567075" font-weight="normal" text-anchor="middle">30 × 30 = 900</text>
<line x1="88" y1="486" x2="388" y2="486" stroke="#173c42" stroke-width="1.25"/>
<line x1="88" y1="481" x2="88" y2="491" stroke="#173c42" stroke-width="1.25"/>
<line x1="388" y1="481" x2="388" y2="491" stroke="#173c42" stroke-width="1.25"/>
<text x="238" y="512" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#173c42" font-weight="normal" text-anchor="middle">b = 30</text>
<line x1="58" y1="160" x2="58" y2="460" stroke="#567075" stroke-width="1.25"/>
<line x1="53" y1="160" x2="63" y2="160" stroke="#567075" stroke-width="1.25"/>
<line x1="53" y1="460" x2="63" y2="460" stroke="#567075" stroke-width="1.25"/>
<text x="39" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#567075" text-anchor="middle" transform="rotate(-90 39 310)">b = 30</text>
<line x1="398" y1="461" x2="435" y2="489" stroke="#d69b36" stroke-width="2"/>
<text x="445" y="500" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#173c42" font-weight="bold" text-anchor="start">c = 2</text>
<line x1="470" y1="137" x2="470" y2="452" stroke="#d6dfdc" stroke-width="1"/>
<text x="524" y="151" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#167d8d" font-weight="bold" text-anchor="start">LENGTH</text>
<text x="524" y="194" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#173c42" font-weight="bold" text-anchor="start">c = ka − b</text>
<text x="524" y="229" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#567075" font-weight="normal" text-anchor="start">2 = 4 · 8 − 30</text>
<text x="524" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#167d8d" font-weight="bold" text-anchor="start">AREA</text>
<text x="524" y="334" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#173c42" font-weight="bold" text-anchor="start">bc = kab − b² = a² − k</text>
<text x="524" y="370" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#567075" font-weight="normal" text-anchor="start">60 = 960 − 900 = 64 − 4</text>
<rect x="524" y="409" width="80" height="80" rx="0" fill="#e6f1f0" stroke="#167d8d" stroke-width="2"/>
<text x="564" y="442" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#173c42" font-weight="bold" text-anchor="middle">a²</text>
<text x="564" y="470" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#567075" font-weight="normal" text-anchor="middle">64</text>
<text x="628" y="440" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#173c42" font-weight="normal" text-anchor="start">The a-square has area bc + k.</text>
<text x="628" y="470" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#567075" font-weight="normal" text-anchor="start">Area identity; no dissection is assumed.</text>
<text x="42" y="550" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#567075" font-weight="normal" text-anchor="start">All shapes use the same length scale.  Amber marks the b × c remainder.</text>
</svg>
